name: r7-format-fix

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && contains(github.event.comment.body, '/r7-format'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7/finalize-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          node scripts/format.mjs --write
          git restore --source=HEAD -- .github/workflows/ci.yml
      - name: Verify formatter is idempotent
        run: pnpm format:check
      - name: Commit normalization
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical R7 formatting"
          git push origin HEAD:r7/finalize-v1
