name: r7-source-repair

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && contains(github.event.comment.body, '/r7-source-fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7/finalize-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install toolchain
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          npm install --global typescript@5.8.3
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Repair API self-reference and strengthen OpenAPI route assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('apps/api/src/index.ts')
          text = api.read_text()
          old_import = "import { OPENAPI_DOCUMENT } from './openapi.js';"
          new_import = "import { OPENAPI_DOCUMENT } from '@agentforge/api/openapi';"
          if old_import not in text:
              raise SystemExit('expected API import not found; refusing broad rewrite')
          api.write_text(text.replace(old_import, new_import, 1))

          test = Path('tests/api.test.ts')
          text = test.read_text()
          old_test = """test('OpenAPI contract lists every required V1 route', () => {
            const paths = OPENAPI_DOCUMENT.paths as Record<string, unknown>;
            for (const route of API_ROUTE_KEYS) assert.ok(paths[route] !== undefined, `missing OpenAPI route ${route}`);
          });"""
          new_test = """test('OpenAPI contract lists every required V1 route', () => {
            const paths = OPENAPI_DOCUMENT.paths as Record<string, Record<string, unknown>>;
            for (const route of API_ROUTE_KEYS) {
              const separator = route.indexOf(' ');
              const method = route.slice(0, separator).toLowerCase();
              const path = route.slice(separator + 1);
              const operations = paths[path];
              assert.ok(operations !== undefined, `missing OpenAPI path ${path}`);
              assert.ok(operations[method] !== undefined, `missing OpenAPI operation ${route}`);
            }
          });"""
          if old_test not in text:
              raise SystemExit('expected OpenAPI test block not found; refusing broad rewrite')
          test.write_text(text.replace(old_test, new_test, 1))
          PY
      - name: Verify static and deterministic gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm check:placeholders
          pnpm test:unit
      - name: Commit exact repair
        run: |
          git diff -- apps/api/src/index.ts tests/api.test.ts
          git diff --exit-code -- . ':(exclude)apps/api/src/index.ts' ':(exclude)tests/api.test.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/index.ts tests/api.test.ts
          git commit -m "fix(api): align OpenAPI source and contract verification"
          git push origin HEAD:r7/finalize-v1
