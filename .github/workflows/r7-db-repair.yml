name: r7-db-repair

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && contains(github.event.comment.body, '/r7-db-fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://agentforge:agentforge@127.0.0.1:5432/agentforge_test
      AGENTFORGE_ALLOW_TEST_DB_RESET: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7/finalize-v1
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install toolchain
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          npm install --global typescript@5.8.3
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Frozen install
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Apply exact persistence repair
        run: python control/scripts/r7-db-repair.py candidate
      - name: Verify static and deterministic gates
        working-directory: candidate
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm check:placeholders
          pnpm test:unit
      - name: Verify PostgreSQL migration and integration gates
        working-directory: candidate
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:smoke
          pnpm test:integration
      - name: Commit exact repair
        working-directory: candidate
        run: |
          git diff -- packages/persistence/migrations/0001_initial.sql packages/persistence/src/index.ts
          git diff --exit-code -- . ':(exclude)packages/persistence/migrations/0001_initial.sql' ':(exclude)packages/persistence/src/index.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/migrations/0001_initial.sql packages/persistence/src/index.ts
          git commit -m "fix(persistence): make PostgreSQL commits causally visible"
          git push origin HEAD:r7/finalize-v1
