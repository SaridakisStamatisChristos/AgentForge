services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - agentforge-postgres:/var/lib/postgresql/data

  migrate:
    profiles: ["runtime"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "--experimental-transform-types", "--conditions=development", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://agentforge:agentforge@postgres:5432/agentforge

  api:
    profiles: ["runtime"]
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "--conditions=development", "apps/api/dist/index.js"]
    environment:
      DATABASE_URL: postgresql://agentforge:agentforge@postgres:5432/agentforge
      AGENTFORGE_API_HOST: 0.0.0.0
      AGENTFORGE_API_PORT: 8787
    ports:
      - "8787:8787"

  worker:
    profiles: ["runtime"]
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "--conditions=development", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgresql://agentforge:agentforge@postgres:5432/agentforge
      AGENTFORGE_WORKER_ID: compose-worker-1

volumes:
  agentforge-postgres:
